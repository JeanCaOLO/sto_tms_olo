<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <defs>
    <linearGradient id="intelixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowIntelix" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <clipPath id="xClip">
      <rect x="40" y="10" width="40" height="40" rx="8" />
    </clipPath>
  </defs>
  
  <!-- Fondo moderno con esquinas redondeadas -->
  <rect x="40" y="10" width="40" height="40" rx="8" fill="url(#intelixGradient)" filter="url(#shadowIntelix)" />
  <rect x="42" y="12" width="36" height="36" rx="6" fill="white" />
  
  <!-- Letra X estilizada - Diseño moderno -->
  <path d="M55,20 L65,30 L55,40 L65,20 L55,30 L65,40" 
        fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round" 
        stroke-linejoin="round" transform="translate(0, 0)" />
  
  <!-- X con efecto 3D -->
  <path d="M55,20 L65,30" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <path d="M55,40 L65,30" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <path d="M65,20 L55,30" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" />
  <path d="M65,40 L55,30" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" />
  
  <!-- Punto central -->
  <circle cx="60" cy="30" r="3" fill="#0369a1" />
  
  <!-- Texto INTELIX -->
  <text x="60" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="16" 
        fill="#0369a1" text-anchor="middle" transform="translate(0, 25)">
    INTELIX
  </text>
  <text x="60" y="45" font-family="Arial, sans-serif" font-size="10" 
        fill="#6c757d" text-anchor="middle" transform="translate(0, 25)">
    Innovation Technology
  </text>
  
  <!-- Elementos tecnológicos alrededor -->
  <circle cx="20" cy="30" r="3" fill="#0ea5e9" opacity="0.6">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="30" r="3" fill="#0ea5e9" opacity="0.6">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="0.5s" />
  </circle>
  
  <!-- Líneas de conexión -->
  <path d="M45,30 L55,30" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />
  <path d="M65,30 L75,30" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />
  
  <!-- Firma digital -->
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="8" fill="#6c757d" text-anchor="middle">
    © 2024
  </text>
</svg>