version = 0.1
# Deploy (solo Intelix): sam build && sam deploy --config-env <dev|qa|prod>
# Antes: cargar client_id y client_secret de Google en el secreto /<env>/tms/google-oauth (ver template.yaml).
# GoogleRedirectUri y AppUrl: completar con la URL real del API Gateway y del frontend de cada ambiente.

[dev.deploy.parameters]
stack_name = "dev-tms-tarifas-mail"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=dev",
  "CommonStackName=dev-tms-common-services",
  "TarifasFunctionName=dev-tms-tarifas-tarifas-api",
  "GoogleRedirectUri=https://CAMBIAR.execute-api.us-east-2.amazonaws.com/api/tarifas-mail/google/callback",
  "AppUrl=https://sandbox.d1q6tzcx0ew3rk.amplifyapp.com"
]
tags = ["Project=TMS", "Environment=DEV", "Name=dev-tms-tarifas-mail"]

[qa.deploy.parameters]
stack_name = "qa-tms-tarifas-mail"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=qa",
  "CommonStackName=qa-tms-common-services",
  "TarifasFunctionName=qa-tms-tarifas-tarifas-api",
  "GoogleRedirectUri=https://CAMBIAR.execute-api.us-east-2.amazonaws.com/api/tarifas-mail/google/callback",
  "AppUrl=https://CAMBIAR"
]
tags = ["Project=TMS", "Environment=QA", "Name=qa-tms-tarifas-mail"]

[prod.deploy.parameters]
stack_name = "prod-tms-tarifas-mail"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=prod",
  "CommonStackName=prod-tms-common-services",
  "TarifasFunctionName=prod-tms-tarifas-tarifas-api",
  "GoogleRedirectUri=https://CAMBIAR.execute-api.us-east-2.amazonaws.com/api/tarifas-mail/google/callback",
  "AppUrl=https://CAMBIAR"
]
tags = ["Project=TMS", "Environment=PROD", "Name=prod-tms-tarifas-mail"]
