version = 0.1
# Deploy (solo Intelix): sam build && sam deploy --config-env <dev|qa|prod>
# Destinatarios del correo de vencimientos: pedido del usuario 2026-10-12 ("de momento").
# SES en sandbox: remitente y destinatarios deben estar VERIFICADOS en SES.

[dev.deploy.parameters]
stack_name = "dev-tms-alerts"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=dev",
  "CommonStackName=dev-tms-common-services",
  "CommonLayerArn=/dev/tms/common-layer-arn",
  "SubnetIds=/dev/tms/network/subnets",
  "SecurityGroupId=/dev/tms/network/lambda-sg",
  "AlertFrom=jalvarez@ologistics.com",
  "AlertTo=jbonilla@ologistics.com",
  "AlertCc=rperez@ologistics.com",
  "AppUrl=https://sandbox.d1q6tzcx0ew3rk.amplifyapp.com"
]
tags = ["Project=TMS", "Environment=DEV", "Name=dev-tms-alerts"]

[qa.deploy.parameters]
stack_name = "qa-tms-alerts"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=qa",
  "CommonStackName=qa-tms-common-services",
  "CommonLayerArn=/qa/tms/common-layer-arn",
  "SubnetIds=/qa/tms/network/subnets",
  "SecurityGroupId=/qa/tms/network/lambda-sg",
  "AlertFrom=jalvarez@ologistics.com",
  "AlertTo=jbonilla@ologistics.com",
  "AlertCc=rperez@ologistics.com"
]
tags = ["Project=TMS", "Environment=QA", "Name=qa-tms-alerts"]

[prod.deploy.parameters]
stack_name = "prod-tms-alerts"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=prod",
  "CommonStackName=prod-tms-common-services",
  "CommonLayerArn=/prod/tms/common-layer-arn",
  "SubnetIds=/prod/tms/network/subnets",
  "SecurityGroupId=/prod/tms/network/lambda-sg",
  "AlertFrom=jalvarez@ologistics.com",
  "AlertTo=jbonilla@ologistics.com",
  "AlertCc=rperez@ologistics.com"
]
tags = ["Project=TMS", "Environment=PROD", "Name=prod-tms-alerts"]
