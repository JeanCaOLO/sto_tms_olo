AWSTemplateFormatVersion: "2010-09-09"
Description: TMS - SECRETS | Contenedores de secretos del backend (los valores reales se cargan en consola, nunca en el repo)

# Estándar §5: los secretos se crean con un template aparte y los valores se
# ajustan después en la consola. Este stack se despliega una vez por ambiente
# y NO se vuelve a tocar al actualizar los módulos.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]

Resources:
  DbSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub /${Environment}/tms/db
      Description: TMS - Aurora tms_olo (host, port, username, password, dbname)
      SecretString: '{"host":"CAMBIAR","port":5432,"username":"CAMBIAR","password":"CAMBIAR","dbname":"tms_olo"}'

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub /${Environment}/tms/jwt
      Description: TMS - Clave de firma de sesiones (jwt_secret). Usar el mismo JWT_SECRET del Express para no invalidar sesiones.
      SecretString: '{"jwt_secret":"CAMBIAR"}'

  EflowSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub /${Environment}/tms/eflow
      Description: TMS - Credenciales SQL Server de EFLOW por país (read-only)
      SecretString: '{"cr":{"host":"CAMBIAR","port":1433,"user":"CAMBIAR","password":"CAMBIAR","db_wmh":"EFLOW_WMH","db_sap":"EFLOW_OLO"},"ve":{"host":"CAMBIAR","port":1446,"user":"CAMBIAR","password":"CAMBIAR","db_wmh":"WMH","db_sap":"EFLOW_FEBECA"}}'

Outputs:
  DbSecretName:
    Value: !Sub /${Environment}/tms/db
  JwtSecretName:
    Value: !Sub /${Environment}/tms/jwt
  EflowSecretName:
    Value: !Sub /${Environment}/tms/eflow
