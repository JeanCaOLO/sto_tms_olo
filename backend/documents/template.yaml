AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TMS - DOCUMENTS | Archivos de los catálogos en S3 (hoy, el PDF del contrato del transportista)

# El navegador sube y baja los archivos DIRECTO a S3 con URLs firmadas de vida corta; la Lambda
# solo firma, valida y guarda la llave en Aurora. El bucket es privado (sin acceso público) y con
# versionado: reemplazar un contrato no borra el anterior.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
  CommonStackName:
    Type: String
    Description: Stack de common-services del mismo ambiente (ej. dev-tms-common-services)
  CommonLayerArn:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Parámetro SSM con el ARN de la versión vigente de la Layer tms_common.
  SubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
  SecurityGroupId:
    Type: AWS::SSM::Parameter::Value<String>
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://sandbox.d1q6tzcx0ew3rk.amplifyapp.com,http://localhost:3000"
    Description: Orígenes del frontend que pueden subir/bajar archivos del bucket (CORS).

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: limpiar-subidas-y-versiones-viejas
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
            NoncurrentVersionExpiration: { NoncurrentDays: 365 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [GET, POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      Tags:
        - { Key: Project, Value: TMS }

  # Solo HTTPS hacia el bucket.
  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloHttps
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub ${DocumentsBucket.Arn}/*
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # Rol propio (el compartido de common-services no tiene acceso a S3): VPC + secreto de la BD +
  # lectura/escritura SOLO en este bucket.
  DocumentsApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: documents-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub
                  - arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*
                  - DbSecretName:
                      Fn::ImportValue: !Sub ${CommonStackName}-DbSecretName
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${DocumentsBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
      Tags:
        - { Key: Project, Value: TMS }

  DocumentsApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-documents-api
      RetentionInDays: !If [IsProduction, 30, 7]

  DocumentsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-documents-api
      Description: TMS - DOCUMENTS API | URLs firmadas para subir/bajar el PDF del contrato del transportista
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Architectures: [x86_64]
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt DocumentsApiRole.Arn
      Layers:
        - !Ref CommonLayerArn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref DocumentsApiLogGroup
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          TMS_DB_SECRET_NAME:
            Fn::ImportValue: !Sub ${CommonStackName}-DbSecretName
          DOCUMENTS_BUCKET: !Ref DocumentsBucket

  DocumentsApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DocumentsApiFunction.Arn
      PayloadFormatVersion: "2.0"

  DocumentsApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DocumentsApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*
        - ApiId:
            Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId

  ContractUploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/carriers/{id}/contract/upload
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${DocumentsApiIntegration}

  ContractSaveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: PUT /api/v1/carriers/{id}/contract
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${DocumentsApiIntegration}

  ContractDownloadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/carriers/{id}/contract
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${DocumentsApiIntegration}

  ContractRemoveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: DELETE /api/v1/carriers/{id}/contract
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${DocumentsApiIntegration}

Outputs:
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
