AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TMS - PLANNING | Planificación de rutas - pedidos, planes editables y estado por viaje (/api/v1/planificacion/*)

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
  CommonStackName:
    Type: String
    Description: Stack de common-services del mismo ambiente (ej. dev-tms-common-services)
  CommonLayerArn:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Parámetro SSM con el ARN de la versión vigente de la Layer tms_common (lo actualiza scripts/sandbox/deploy_backend.py). Reemplaza el export de common-services, que bloqueaba publicar versiones nuevas.
  SubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
  SecurityGroupId:
    Type: AWS::SSM::Parameter::Value<String>
  ReplanAppUserId:
    Type: String
    Default: ""
    Description: app_users.id que firma los planes del replan horario. Vacío = el app_user activo más antiguo de la org.

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  PlanningApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-planning-api
      RetentionInDays: !If [IsProduction, 30, 7]

  PlanningApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-planning-api
      Description: TMS - PLANNING API | Planificador automático - bandeja, pedidos y planes (armar/replanificar)
      # Mismo patrón que los demás microservicios: código propio en src/ (app.py)
      # con tms_common desde la Layer compartida.
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Architectures: [x86_64]
      Timeout: 120  # el replan programado recorre todos los almacenes; HTTP igual corta a 30s en API Gateway
      MemorySize: 512
      Role:
        Fn::ImportValue: !Sub ${CommonStackName}-LambdaRoleArn
      Layers:
        - !Ref CommonLayerArn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref PlanningApiLogGroup
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          REPLAN_APP_USER_ID: !Ref ReplanAppUserId
          TMS_DB_SECRET_NAME:
            Fn::ImportValue: !Sub ${CommonStackName}-DbSecretName
          # Ingesta de pedidos y artículos del pedido leen eFlow en vivo (eflow_db).
          EFLOW_SECRET_NAME:
            Fn::ImportValue: !Sub ${CommonStackName}-EflowSecretName
      # Sin reintentos async: una ingesta fallida (eFlow sin credenciales) no se repite
      # 3 veces; la siguiente corrida de 10 min es el reintento.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        IngestaBandeja:
          Type: ScheduleV2
          Properties:
            Name: !Sub ${AWS::StackName}-ingesta-bandeja
            Description: Actualiza la bandeja desde eFlow cada 10 min, L-V 05:00-16:50 CR
            # Falla (y queda en el historial) mientras el secreto de eFlow esté vacío.
            ScheduleExpression: cron(0/10 5-16 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/Costa_Rica
            Input: '{"accion": "ingesta_bandeja"}'
        ReplanHorario:
          Type: ScheduleV2
          Properties:
            Name: !Sub ${AWS::StackName}-replan-horario
            Description: Replan automático cada hora (sin ingesta), L-V 05:00-16:00 CR
            # Hasta 16:00 y no 17:00: Aurora se apaga a las 17:00 (infra/horarios).
            ScheduleExpression: cron(0 5-16 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/Costa_Rica
            Input: '{"accion": "replan_programado"}'

  PlanningApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PlanningApiFunction.Arn
      PayloadFormatVersion: "2.0"

  PlanningApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PlanningApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*
        - ApiId:
            Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId

  PlanningOrdersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/planificacion/pedidos
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${PlanningApiIntegration}

  PlanningOrderItemsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/planificacion/pedidos/{id}/articulos
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${PlanningApiIntegration}

  PlanningOrderDeliveryDateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/planificacion/pedidos/{id}/fecha-entrega
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${PlanningApiIntegration}

  PlanningBandejaRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/planificacion/bandeja
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${PlanningApiIntegration}

  PlanningCreatePlanRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/planificacion/planes
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${PlanningApiIntegration}

  PlanningReplanRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/planificacion/planes/replanificar
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${PlanningApiIntegration}

  PlanningListPlansRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/planificacion/planes
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${PlanningApiIntegration}

  PlanningGetPlanRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/planificacion/planes/{id}
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${PlanningApiIntegration}

Outputs:
  PlanningApiFunctionArn:
    Value: !GetAtt PlanningApiFunction.Arn
