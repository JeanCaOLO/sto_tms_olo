version = 0.1
# Deploy en dev/qa: lo hace el equipo (python scripts/sandbox/deploy_backend.py oms).
# W1/W2/W3 cableados (2026-10-21). dev corre en live (lee orders, escribe a
# sim_expedicionescabecera) con barrido frecuente para probar. qa/prod: ajustar.

[dev.deploy.parameters]
stack_name = "dev-tms-oms"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=dev",
  "CommonStackName=dev-tms-common-services",
  "CommonLayerArn=/dev/tms/common-layer-arn",
  "SubnetIds=/dev/tms/network/subnets",
  "SecurityGroupId=/dev/tms/network/lambda-sg",
  "OmsSource=live",
  "BarridoSchedule=rate(15 minutes)"
]
tags = ["Project=TMS", "Environment=DEV", "Name=dev-tms-oms"]

[qa.deploy.parameters]
stack_name = "qa-tms-oms"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=qa",
  "CommonStackName=qa-tms-common-services",
  "CommonLayerArn=/qa/tms/common-layer-arn",
  "SubnetIds=/qa/tms/network/subnets",
  "SecurityGroupId=/qa/tms/network/lambda-sg"
]
tags = ["Project=TMS", "Environment=QA", "Name=qa-tms-oms"]

[prod.deploy.parameters]
stack_name = "prod-tms-oms"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = [
  "Environment=prod",
  "CommonStackName=prod-tms-common-services",
  "CommonLayerArn=/prod/tms/common-layer-arn",
  "SubnetIds=/prod/tms/network/subnets",
  "SecurityGroupId=/prod/tms/network/lambda-sg"
]
tags = ["Project=TMS", "Environment=PROD", "Name=prod-tms-oms"]
