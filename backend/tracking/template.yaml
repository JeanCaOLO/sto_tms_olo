AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TMS - TRACKING | Monitoreo en vivo de viajes: posiciones GPS, paradas y evidencias de entrega

# Las evidencias de entrega (foto de factura firmada, firma digital) van DIRECTO de la app del chofer a
# S3 con formularios firmados de vida corta; la Lambda solo firma, valida y guarda la llave en Aurora.
# El bucket es privado (sin acceso público) y con versionado.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
  CommonStackName:
    Type: String
    Description: Stack de common-services del mismo ambiente (ej. dev-tms-common-services)
  CommonLayerArn:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Parámetro SSM con el ARN de la versión vigente de la Layer tms_common.
  SubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
  SecurityGroupId:
    Type: AWS::SSM::Parameter::Value<String>
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://sandbox.d1q6tzcx0ew3rk.amplifyapp.com,http://localhost:3000"
    Description: Orígenes que pueden subir/bajar evidencias del bucket (CORS). La app nativa no lo necesita.

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  TrackingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: limpiar-subidas-y-versiones-viejas
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
            NoncurrentVersionExpiration: { NoncurrentDays: 365 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [GET, POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      Tags:
        - { Key: Project, Value: TMS }

  # Solo HTTPS hacia el bucket.
  TrackingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrackingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloHttps
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TrackingBucket.Arn
              - !Sub ${TrackingBucket.Arn}/*
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # Rol propio (el compartido de common-services no tiene acceso a S3): VPC + secreto de la BD +
  # lectura/escritura SOLO en este bucket.
  TrackingApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: tracking-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub
                  - arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-*
                  - DbSecretName:
                      Fn::ImportValue: !Sub ${CommonStackName}-DbSecretName
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${TrackingBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt TrackingBucket.Arn
      Tags:
        - { Key: Project, Value: TMS }

  TrackingApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-tracking-api
      RetentionInDays: !If [IsProduction, 30, 7]

  TrackingApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-tracking-api
      Description: TMS - TRACKING API | Monitoreo de viajes, posiciones GPS, paradas y evidencias
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Architectures: [x86_64]
      Timeout: 20
      MemorySize: 256
      Role: !GetAtt TrackingApiRole.Arn
      Layers:
        - !Ref CommonLayerArn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref TrackingApiLogGroup
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          TMS_DB_SECRET_NAME:
            Fn::ImportValue: !Sub ${CommonStackName}-DbSecretName
          TRACKING_BUCKET: !Ref TrackingBucket

  TrackingApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TrackingApiFunction.Arn
      PayloadFormatVersion: "2.0"

  TrackingApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TrackingApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*
        - ApiId:
            Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId

  ListViajesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/tracking/viajes
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  GetViajeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/tracking/viajes/{id}
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  TrailRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/tracking/viajes/{id}/recorrido
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  ListPlanificadosRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/tracking/planificados
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  StartViajeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/tracking/viajes/{id}/iniciar
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  CompleteViajeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/tracking/viajes/{id}/completar
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  ReviewViajeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/tracking/viajes/{id}/revisar
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  SummaryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/tracking/resumen
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  PositionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/tracking/posiciones
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  StopTransitionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/tracking/paradas/{id}/transicion
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  EvidenceUploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/tracking/paradas/{id}/evidencias/upload-url
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  EvidenceConfirmRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/tracking/paradas/{id}/evidencias
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  MyTripsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: GET /api/v1/tracking/mi-viaje
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

  ConsentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${CommonStackName}-HttpApiId
      RouteKey: POST /api/v1/tracking/consentimiento-gps
      AuthorizationType: CUSTOM
      AuthorizerId:
        Fn::ImportValue: !Sub ${CommonStackName}-JwtAuthorizerId
      Target: !Sub integrations/${TrackingApiIntegration}

Outputs:
  TrackingBucketName:
    Value: !Ref TrackingBucket
