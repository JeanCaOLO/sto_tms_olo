AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TMS - OSRM | Motor de calles propio (OSRM con los mapas de Costa Rica y Venezuela) para el motor
  de ruteo de Planificación. Una EC2 dentro de la VPC de Aurora, alcanzable solo desde las Lambdas
  del TMS. Reemplaza al servidor público de demostración (sin SLA) para el backend.

# Fase 2 del motor de ruteo (docs/planificacion/pendientes/06-motor-de-ruteo-fases.md).
# - Las Lambdas están en subnets privadas SIN NAT: no pueden salir a un OSRM público, por eso el
#   servidor vive en la misma VPC y se consume por su IP privada.
# - La instancia va en una subnet pública SOLO para tener salida a internet en el primer arranque
#   (imagen de Docker Hub + mapas de Geofabrik). No acepta entrada desde internet: el security group
#   solo abre los puertos 5000-5001 a las Lambdas.
# - Un contenedor por país: Costa Rica en :5000, Venezuela en :5001 (OSRM no mezcla extractos). El
#   backend elige por la región del almacén (OSRM_URL = "CR=...:5000;VN=...:5001", output OsrmUrl).
# - El UserData solo corre en el PRIMER arranque: para cambiar mapas hay que reemplazar la instancia
#   (cambiar el nombre lógico del recurso, como se hizo al pasar de `Instance` a `Servidor` el
#   2026-11-13 para sumar Venezuela). La IP privada cambia: redesplegar planning después.
# - Mismo horario que Aurora (infra/horarios): L-V 04:45-17:00 hora de Costa Rica. Al apagar y
#   encender conserva el disco (mapa ya procesado) y la IP privada.
# - Sin llave SSH ni perfil de instancia. Para diagnosticar el arranque:
#   aws ec2 get-console-output --instance-id <id> --latest

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0a8252dbb12741364
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0ec6329b88ede025c
    Description: Subnet pública (us-east-2c) con salida por el internet gateway.
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-06b3986a1f95d2f19
    Description: Security group de las Lambdas del TMS (único origen permitido).
  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-0df8a753693e6366d
    Description: >-
      Amazon Linux 2023 x86_64 (us-east-2, resuelta el 2026-11-13). Fija a propósito: cambiarla
      REEMPLAZA la instancia (reprocesa los mapas y cambia la IP privada → redesplegar planning).
  InstanceType:
    Type: String
    Default: t3.medium
    Description: >-
      4 GB de RAM + 6 GB de swap. Servir los dos mapas usa ~2 GB; el swap es para procesar el de
      Venezuela (128 MB comprimido) una sola vez.
  StartCron:
    Type: String
    Default: cron(45 4 ? * MON-FRI *)
  StopCron:
    Type: String
    Default: cron(0 17 ? * MON-FRI *)
  TimeZone:
    Type: String
    Default: America/Costa_Rica

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${AWS::StackName}
      GroupDescription: OSRM del TMS - puerto 5000 solo desde las Lambdas del TMS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5001
          SourceSecurityGroupId: !Ref LambdaSecurityGroupId
          Description: Lambdas del TMS

  Servidor:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
          AssociatePublicIpAddress: true
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 24, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Primer arranque: instala Docker y, por cada país, baja el mapa, lo procesa y deja un
          # OSRM sirviendo (CR :5000, VN :5001). En los arranques siguientes Docker levanta solo
          # los contenedores (--restart unless-stopped).
          exec > >(tee /var/log/osrm-setup.log /dev/console) 2>&1
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker
          # 6 GB de swap: colchón para osrm-extract del mapa de Venezuela.
          fallocate -l 6G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo "/swapfile none swap sw 0 0" >> /etc/fstab
          IMG=osrm/osrm-backend:latest
          docker pull $IMG
          mapa() {  # mapa <nombre> <puerto> <url de Geofabrik>
            mkdir -p /data/$1 && cd /data/$1
            curl -fL --retry 5 -o $1.osm.pbf "$3"
            docker run --rm -v /data/$1:/data $IMG osrm-extract -p /opt/car.lua /data/$1.osm.pbf
            docker run --rm -v /data/$1:/data $IMG osrm-partition /data/$1.osrm
            docker run --rm -v /data/$1:/data $IMG osrm-customize /data/$1.osrm
            rm -f $1.osm.pbf
            docker run -d --name osrm-$1 --restart unless-stopped -p $2:5000 -v /data/$1:/data $IMG \
              osrm-routed --algorithm mld --max-table-size 1000 /data/$1.osrm
            echo "[osrm-setup] $1 LISTO en :$2"
          }
          mapa costa-rica 5000 https://download.geofabrik.de/central-america/costa-rica-latest.osm.pbf
          mapa venezuela 5001 https://download.geofabrik.de/south-america/venezuela-latest.osm.pbf
          echo "[osrm-setup] LISTO"

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: encender-apagar-osrm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Servidor}

  StartOsrm:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${AWS::StackName}-encender
      Description: Enciende el OSRM del TMS lunes a viernes 04:45 CR
      ScheduleExpression: !Ref StartCron
      ScheduleExpressionTimezone: !Ref TimeZone
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:startInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${Servidor}"]}'
        RetryPolicy: { MaximumRetryAttempts: 3, MaximumEventAgeInSeconds: 3600 }

  StopOsrm:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${AWS::StackName}-apagar
      Description: Apaga el OSRM del TMS lunes a viernes 17:00 CR
      ScheduleExpression: !Ref StopCron
      ScheduleExpressionTimezone: !Ref TimeZone
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${Servidor}"]}'
        RetryPolicy: { MaximumRetryAttempts: 3, MaximumEventAgeInSeconds: 3600 }

Outputs:
  OsrmUrl:
    Description: OSRM por región, con la IP privada (solo alcanzable desde las Lambdas del TMS). Lo consume el stack planning.
    Value: !Sub CR=http://${Servidor.PrivateIp}:5000;VN=http://${Servidor.PrivateIp}:5001
  InstanceId:
    Value: !Ref Servidor
  Horario:
    Value: "Lunes a viernes 04:45-17:00 America/Costa_Rica"
