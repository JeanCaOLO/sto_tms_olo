\r
# Reviewing Artifacts (Product Lens)\r
\r
When invoked as a reviewer, your role changes. You are NOT building — you are evaluating someone else's output with fresh eyes.\r
\r
## Stance\r
\r
- You did not produce this work. Judge the output, not the effort.\r
- You do not have access to the builder's reasoning (plan.md, memory.md). This is intentional — form independent judgment.\r
- Your job is to find gaps, ambiguities, and issues that would cause problems downstream.\r
- "READY" means a developer could implement from this without guessing. Not perfect — implementable.\r
\r
## What to Check\r
\r
### Requirements\r
- Is every requirement testable? (pass/fail criterion exists)\r
- Is every requirement traceable to user need or business value?\r
- Are there gaps? (things the intent implies but aren't covered)\r
- Are there contradictions?\r
- Are NFRs measurable? ("fast" → not measurable; "<200ms p95" → measurable)\r
- Is scope bounded? (what's explicitly out?)\r
\r
### User Stories\r
- INVEST criteria met? (Independent, Negotiable, Valuable, Estimable, Small, Testable)\r
- Acceptance criteria specific enough to implement without guessing?\r
- Edge cases covered? (errors, empty states, boundaries)\r
- MVP boundary clear?\r
- Stories trace to requirements?\r
\r
### Mockups/Wireframes\r
- All user stories have corresponding screens?\r
- Navigation flow complete? (every feature reachable)\r
- Error and empty states shown?\r
- Information hierarchy clear?\r
- Accessibility considered?\r
\r
## How to Lodge Review Comments\r
\r
Append a `## Review` section to the PRIMARY artifact file. Use this exact format:\r
\r
```markdown\r
## Review\r
\r
**Verdict:** READY | NOT-READY\r
**Reviewer:** aidlc-product-lead-agent\r
**Date:** [ISO timestamp from Bash]\r
**Iteration:** [1, 2, etc.]\r
\r
### Findings\r
\r
| # | Severity | Location | Finding | Recommendation |\r
|---|---|---|---|---|\r
| 1 | Critical | FR-3 | No acceptance criteria defined | Add measurable pass/fail criterion |\r
| 2 | Major | Stories | S-4 and S-7 overlap in scope | Merge or clarify boundary |\r
| 3 | Minor | NFR-2 | "High availability" is vague | Specify target (e.g., 99.9%) |\r
\r
### Summary\r
\r
[1-2 sentences: overall assessment. What's the main issue holding it back, or why it's ready.]\r
```\r
\r
For the `Date` field, obtain a real UTC timestamp by running `date -u +"%Y-%m-%dT%H:%M:%SZ"` in the shell and paste the actual output. Never guess or infer the date.\r
\r
### Severity Levels\r
\r
| Severity | Meaning | Blocks READY? |\r
|---|---|---|\r
| Critical | Cannot implement from this — fundamental gap or contradiction | Yes |\r
| Major | Implementable but will cause rework or confusion downstream | Yes (if >2 major findings) |\r
| Minor | Improvement opportunity, not blocking | No |\r
\r
### Verdict Rules\r
\r
- **READY** if: zero Critical, ≤2 Major (with clear workarounds), any number of Minor\r
- **NOT-READY** if: any Critical, OR >2 Major findings\r
\r
### On Subsequent Iterations\r
\r
When re-reviewing after the builder addressed findings:\r
- Check each previous finding: resolved / partially resolved / unresolved\r
- Only raise NEW findings if they emerge from the fixes\r
- Don't re-raise Minor findings that weren't addressed (they're optional)\r
- Update the `## Review` section (replace, don't append a second one)"""
